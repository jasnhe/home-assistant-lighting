bedside_music:
  alias: Bedside Music
  description: >-
    Allows the two WLED strips to follow LedFx running on the Mac.
    Start LedFx and play Mac audio through Multi-Output Device first.
  icon: mdi:music
  mode: single
  sequence:
    - action: light.turn_on
      target:
        entity_id:
          - light.YOUR_SHELF_ENTITY
          - light.YOUR_CORNER_MASTER_ENTITY
      data:
        brightness: 255
    - action: select.select_option
      target:
        entity_id:
          - select.YOUR_SHELF_LIVE_OVERRIDE
          - select.YOUR_CORNER_LIVE_OVERRIDE
      data:
        option: '0'
