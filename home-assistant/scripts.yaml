bedside_day:
  alias: Bedside Day
  description: Bedside Day lighting. Overrides LedFx music input.
  mode: single
  sequence:
    - action: select.select_option
      target:
        entity_id:
          - select.YOUR_SHELF_LIVE_OVERRIDE
          - select.YOUR_CORNER_LIVE_OVERRIDE
      data:
        option: '1'
    - action: scene.apply
      data:
        entities:
          light.YOUR_SHELF_ENTITY:
            state: 'on'
            brightness: 255
            color_mode: rgbw
            rgbw_color: [255, 160, 55, 180]
            effect: Solid
          light.YOUR_CORNER_MASTER_ENTITY:
            state: 'on'
            brightness: 255
          light.YOUR_CORNER_COLOUR_ENTITY:
            state: 'on'
            brightness: 255
            color_mode: rgbw
            rgbw_color: [255, 160, 55, 180]
            effect: Solid
    - action: light.turn_on
      target:
        entity_id: light.YOUR_LAMP_WHITE_ENTITY
      data:
        effect: Day
    - action: light.turn_on
      target:
        entity_id: light.YOUR_LAMP_WHITE_ENTITY
      data:
        brightness_pct: 100
    - action: light.turn_on
      target:
        entity_id: light.YOUR_LAMP_WHITE_ENTITY
      data:
        color_temp_kelvin: 2700

